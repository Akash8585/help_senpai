<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7C6CFF" />
            <stop offset="0.55" stop-color="#5B5BF0" />
            <stop offset="1" stop-color="#2F6BEB" />
        </linearGradient>
        <radialGradient id="glowPink" cx="0.86" cy="0.12" r="0.6">
            <stop offset="0" stop-color="#F59AD8" stop-opacity="0.85" />
            <stop offset="1" stop-color="#F59AD8" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glowTeal" cx="0.08" cy="0.95" r="0.55">
            <stop offset="0" stop-color="#5EE0D0" stop-opacity="0.7" />
            <stop offset="1" stop-color="#5EE0D0" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8B5CF6" />
            <stop offset="1" stop-color="#2F6BEB" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1660" flood-opacity="0.35" />
        </filter>
    </defs>

    <!-- Tile -->
    <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)" />
    <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glowPink)" />
    <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glowTeal)" />

    <!-- Speech bubble -->
    <path
        filter="url(#shadow)"
        fill="#FFFFFF"
        d="M330 222 H694 A132 132 0 0 1 826 354 V598 A132 132 0 0 1 694 730 H468 L318 832 C302 843 282 831 285 812 L298 730 H330 A132 132 0 0 1 198 598 V354 A132 132 0 0 1 330 222 Z"
    />

    <!-- Insight sparkle -->
    <path
        fill="url(#spark)"
        d="M512 296 C524 396 554 432 648 446 C554 460 524 496 512 596 C500 496 470 460 376 446 C470 432 500 396 512 296 Z"
    />
    <path fill="url(#spark)" d="M664 552 C669 590 680 602 716 608 C680 614 669 626 664 664 C659 626 648 614 612 608 C648 602 659 590 664 552 Z" />
</svg>
