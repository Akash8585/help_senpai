<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <!-- Simplified variant of logo.svg for 16-32px: full-bleed tile, larger bubble, one bold sparkle. -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7C6CFF" />
            <stop offset="0.55" stop-color="#5B5BF0" />
            <stop offset="1" stop-color="#2F6BEB" />
        </linearGradient>
        <radialGradient id="glowPink" cx="0.9" cy="0.08" r="0.55">
            <stop offset="0" stop-color="#F59AD8" stop-opacity="0.75" />
